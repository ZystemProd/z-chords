<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chord Viewer – Piano Notes Highlighter</title>
    <link rel="stylesheet" href="styles.css">
    <!-- SVG Favicon -->
    <link rel="icon" type="image/svg+xml" href="SVG/zchord-logo-96px.svg">
    <link rel="alternate icon" type="image/png" href="SVG/zchord-logo-96px.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>


</head>

<body>
    <div class="app">
        <header>
            <h1>Chord Viewer</h1>
            <div style="color:#9fb0c2;font-size:13px;margin-top:6px">Type a chord (e.g. C, Dm, Bbmaj7, G7) and click
                Add. You can switch inversion per chord.</div>
        </header>

        <section class="controls">
            <!-- Row 1 -->
            <div class="controls-row row-1">
                <div class="left">
                    <input id="chordInput" type="text" placeholder="e.g. C, Dm, Bbmaj7, F#7" list="suggestions"
                        autocomplete="off" />
                    <datalist id="suggestions"></datalist>
                    <button id="addChord">Add Chord</button>
                    <button id="openCustomChordModal">Add Custom Chord</button>
                    <button id="addSectionBtn">Add Section</button>
                </div>
                <div class="right">
                    <button id="downloadPdf" class="btn">
                        <img src="SVG/downloadpdf.svg" alt="Download PDF" />
                    </button>
                    <button id="themeToggle" aria-label="Toggle theme" title="Toggle theme" class="btn"
                        type="button"></button>

                </div>
            </div>

            <!-- Row 2 -->
            <div class="controls-row row-2">
                <div class="right">
                    <button id="toggleInstrument">Switch to Guitar</button>
                    <button id="clearAll">Clear</button>
                    <span>Transpose:</span>
                    <button id="transposeDown">–1</button>
                    <button id="transposeUp">+1</button>
                </div>
            </div>
        </section>




        <section class="boards" id="boards"></section>


        <!-- Custom Chord Modal -->
        <div id="customChordModal" class="modal">
            <div class="modal-content">
                <span id="closeModal" class="close">&times;</span>
                <h3>Create Custom Chord</h3>
                <div id="customPiano"></div>
                <div>
                    <label>Chord Name: </label>
                    <input type="text" id="customChordName" placeholder="e.g., MyChord">
                </div>
                <div id="suggestedChords" style="margin:10px 0;"></div>
                <button id="addCustomChord">Add Chord</button>
            </div>
        </div>

        <!-- Section Modal -->
        <div id="sectionModal" class="modal">
            <div class="modal-content">
                <span id="closeSectionModal" class="close">&times;</span>
                <h3>Add Section</h3>
                <input id="sectionNameInput" type="text" placeholder="e.g. Intro, Chorus" />
                <button id="saveSectionBtn">Add</button>
            </div>
        </div>

        <!-- Guitar Controls -->
        <div id="guitarControls" style="display:none; margin:10px 0;">
            <select id="guitarKey">
                <option value="C">C</option>
                <option value="C#">C#</option>
                <option value="D">D</option>
                <option value="Eb">Eb</option>
                <option value="E">E</option>
                <option value="F">F</option>
                <option value="F#">F#</option>
                <option value="G">G</option>
                <option value="Ab">Ab</option>
                <option value="A">A</option>
                <option value="Bb">Bb</option>
                <option value="B">B</option>
            </select>

            <select id="guitarMode">
                <option value="pentatonic">Pentatonic</option>
                <option value="blues">Blues</option>
                <option value="major">Major (Ionian)</option>
                <option value="dorian">Dorian</option>
                <option value="phrygian">Phrygian</option>
                <option value="lydian">Lydian</option>
                <option value="mixolydian">Mixolydian</option>
                <option value="aeolian">Natural Minor</option>
                <option value="locrian">Locrian</option>
            </select>

            <button id="updateGuitar">Update</button>
        </div>

        <!-- Single guitar container -->
        <div id="guitar" style="display:none"></div>
    </div>






    <script type="module">
        import { renderScaleSVG, SCALE_FORMULAS } from "./guitar.js";

        const guitarEl = document.getElementById("guitar");
        const keySel = document.getElementById("guitarKey");
        const modeSel = document.getElementById("guitarMode");
        // const updateBtn = document.getElementById("updateGuitar"); // not needed

        function drawScale() {
        const root = keySel.value;
        const mode = modeSel.value;
        const intervals = SCALE_FORMULAS[mode];
        guitarEl.innerHTML = ""; // clear old diagram
        const svg = renderScaleSVG(root, intervals); 
        guitarEl.appendChild(svg);
        }

        // update when dropdowns change
        keySel.addEventListener("change", drawScale);
        modeSel.addEventListener("change", drawScale);

        // optional: remove the button entirely from HTML if you like
        // updateBtn.addEventListener("click", drawScale);

        // draw default
        drawScale();

    </script>



    <script src="script.js"></script>

</body>

</html>
